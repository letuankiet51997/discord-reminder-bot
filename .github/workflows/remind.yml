name: remind

on:
  schedule:
    # Every hour at :07 (UTC). GitHub skips or delays many scheduled runs, so
    # the digest is sent by the first run at or after "dailyAt" each day.
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Gửi tin thử ngay để kiểm tra webhook (không gửi tin tổng hợp)'
        type: boolean
        default: false

# One run at a time, so the digest is never sent twice.
concurrency:
  group: remind
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Send today's digest
        env:
          TZ: Asia/Ho_Chi_Minh
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_ROLES: ${{ secrets.DISCORD_ROLES }}
          TEST_MESSAGE: ${{ inputs.test && '1' || '' }}
        run: node src/send.js

      - name: Save state
        if: always()
        run: |
          if git diff --quiet -- state.json feeds-state.json; then
            echo "state unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json feeds-state.json
          git commit -m "chore(state): record sent digest"
          git pull --rebase
          git push
